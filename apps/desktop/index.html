<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default Light (product default). Boot script below may flip to dark. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" />
    <title>Tau</title>
    <script>
      /* FOUC guard: stamp data-theme before CSS paints. Default Light. */
      (function () {
        var mode = "light";
        try {
          var raw = localStorage.getItem("tau.ui.theme");
          if (raw === "light" || raw === "dark" || raw === "system") mode = raw;
        } catch (e) {}
        var root = document.documentElement;
        if (mode === "system") {
          root.removeAttribute("data-theme");
          var dark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.background = dark ? "#000" : "#fbfbfa";
          root.style.color = dark ? "#f5f5f7" : "#1c1c1e";
        } else {
          root.setAttribute("data-theme", mode);
          root.style.colorScheme = mode;
          root.style.background = mode === "dark" ? "#000" : "#fbfbfa";
          root.style.color = mode === "dark" ? "#f5f5f7" : "#1c1c1e";
        }
      })();
    </script>
    <style>
      /* Instant paint before React - paper light / true-black dark */
      html, body { background: #fbfbfa; color: #1c1c1e; }
      html[data-theme="dark"], html:not([data-theme]) {
        /* :not([data-theme]) is System-on-dark-OS only after the boot script
           clears the attribute; light OS keeps the paper defaults above. */
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]), html:not([data-theme]) body {
          background: #000;
          color: #f5f5f7;
        }
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #000;
        color: #f5f5f7;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
